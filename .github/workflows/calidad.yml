name: Calidad

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install .
      - name: Ejecutar pruebas con cobertura
        run: python -m pytest -q --cov=sarevat --cov-branch --cov-report=term-missing
      - name: Revisar estilo
        run: python -m ruff check SarevatApp_V7_0.py sarevat tests
      - name: Revisar seguridad estática
        run: python -m bandit -q -r sarevat SarevatApp_V7_0.py
      - name: Comprobar dependencias
        run: python -m pip check
