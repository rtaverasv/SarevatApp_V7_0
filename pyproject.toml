[project]
name = "sarevat"
version = "7.0.0"
description = "Administracion segura y planificacion de redes Cisco IPv4"
requires-python = ">=3.11"
dependencies = [
    "netmiko==4.7.0",
    "colorama==0.4.6",
    "pyserial==3.5",
]

[project.scripts]
sarevat = "sarevat.cli:main"
sarevat-gui-alpha = "sarevat.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sarevat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP", "RUF"]

